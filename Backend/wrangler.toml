name = "sober-guardian"
main = "worker.js"
compatibility_date = "2026-08-04"

[[durable_objects.bindings]]
name = "GUARDIAN_RELATIONSHIPS"
class_name = "GuardianRelationship"

[[migrations]]
tag = "guardian-v1"
new_sqlite_classes = ["GuardianRelationship"]

[vars]
# Fail closed in every checked-in deployment. A founder-only local session may
# override this with an ignored `.dev.vars` file, but `wrangler deploy` must not
# publish relationship creation before attestation and abuse controls exist.
GUARDIAN_FOUNDER_MODE = "false"
