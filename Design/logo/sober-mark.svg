<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Sober mark">
  <!-- Iris ring, broken where the light enters. The ring never closes. -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="168 33" transform="rotate(-58 50 50)"/>
  <!-- Pupil -->
  <circle cx="50" cy="50" r="14" fill="currentColor"/>
</svg>
