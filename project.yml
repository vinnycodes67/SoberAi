name: Sober
options:
  bundleIdPrefix: com.soberprototype
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Sober:
    type: application
    platform: iOS
    sources:
      - path: Sober
    info:
      path: Sober/Info.plist
      properties:
        CFBundleDisplayName: Sober
        NSCameraUsageDescription: Sober processes eye and face landmarks on this iPhone during a check. Raw frames are not saved or uploaded.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SoberGuardianAPIURL: "$(SOBER_GUARDIAN_API_URL)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soberprototype.app
        PRODUCT_NAME: Sober
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SOBER_GUARDIAN_API_URL: "http://127.0.0.1:8787"
    scheme:
      testTargets:
        - SoberTests
  SoberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoberTests
    dependencies:
      - target: Sober
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soberprototype.tests
        GENERATE_INFOPLIST_FILE: YES
