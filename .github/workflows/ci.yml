name: CI

# The release gates, run on every change.
#
# The point of this file is that a release candidate can be rebuilt and verified
# without anyone remembering a local incantation. Anything a person would
# otherwise have to know is a step here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checks the change being introduced, not the whole history. Scanning
      # everything would fail on day one for content nobody is touching, and a
      # gate that is red by default stops being read.
      - name: Whitespace and conflict markers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          git diff --check "$base" HEAD

      - name: Release metadata, licences, and secrets
        run: Scripts/check-release-metadata.sh

      - name: Validate plists and shell scripts
        run: |
          plutil -lint Sober/Info.plist
          plutil -lint Sober/Info-Internal.plist
          plutil -lint Sober/PrivacyInfo.xcprivacy
          bash -n Scripts/*.sh

  builds:
    name: Build ${{ matrix.scheme }} ${{ matrix.configuration }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: [Sober, SoberInternal]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - run: brew install xcodegen
      - run: xcodegen generate

      # Every combination builds. The public/internal split is compile-time, so
      # a broken `#if` only shows up in the configuration nobody built locally.
      - name: Build
        run: |
          xcodebuild \
            -project Sober.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" \
            -destination 'generic/platform=iOS Simulator' \
            build

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - run: brew install xcodegen
      - name: Regenerate project and prove it is committed
        run: |
          xcodegen generate
          git diff --exit-code -- Sober.xcodeproj
      - name: Prepare compact simulator
        run: Scripts/prepare-ui-simulators.sh >> "$GITHUB_ENV"
      - name: Test
        run: |
          xcodebuild \
            -project Sober.xcodeproj \
            -scheme Sober \
            -only-testing:SoberTests \
            -destination "platform=iOS Simulator,id=$SOBER_SMALL_UDID" \
            test

  ui-tests:
    name: UI evidence
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - run: brew install xcodegen
      - name: Regenerate project and prove it is committed
        run: |
          xcodegen generate
          git diff --exit-code -- Sober.xcodeproj
      - name: Run compact and accessibility suites
        run: Scripts/run-ui-tests.sh
      - name: Upload retained screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sober-ui-xcresults
          path: .artifacts/ui-tests/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  public-boundary:
    name: Public build boundary
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - run: brew install xcodegen
      - name: Regenerate project and prove it is committed
        run: |
          xcodegen generate
          git diff --exit-code -- Sober.xcodeproj

      # Builds the public Release artifact and asserts no internal route copy,
      # no internal permission keys, and no relay configuration reach it — then
      # builds the internal target to prove each check can actually fail.
      - name: Scan public Release artifact
        run: Scripts/check-public-binary.sh "${RUNNER_TEMP}/boundary"

  backend:
    name: Backend tests (v1.1 preservation)
    runs-on: ubuntu-latest
    # Guardian is not in public v1. These stay green so the v1.1 work is not
    # rotting, but they do not gate a v1 release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        working-directory: Backend
        run: |
          npm ci || npm install
          npm test
